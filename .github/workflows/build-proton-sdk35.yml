name: Build Wine (SDK 35)

on:
  push:
    branches: [ main, master, wine-11.x ]
  pull_request:
    branches: [ main, master, wine-11.x ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [x86_64, aarch64]
      fail-fast: false
    
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            mingw-w64 \
            gcc-multilib \
            g++-multilib \
            libfreetype6-dev \
            libfreetype6-dev:i386 \
            libpng-dev \
            libpng-dev:i386 \
            zlib1g-dev \
            zlib1g-dev:i386
      
      - name: Download and extract termuxfs for ${{ matrix.arch }}
        run: |
          mkdir -p $HOME/termuxfs/${{ matrix.arch }}
          cd $HOME/termuxfs/${{ matrix.arch }}
          wget https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-${{ matrix.arch }}.tar
          tar -xf termuxfs-${{ matrix.arch }}.tar
          ls -la $HOME/termuxfs/${{ matrix.arch }}/
      
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d
      
      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724
      
      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920
      
      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
      
      - name: Autogen
        run: |
          bash build-scripts/build-step0-autogen.sh
      
      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-${{ hashFiles('configure.ac', 'configure') }}
      
      - name: Build wine-tools (step 0)
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        run: |
          bash build-scripts/build-step0.sh
      
      - name: Build sysvshm library for ${{ matrix.arch }}
        if: matrix.arch == 'aarch64'
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --build-sysvshm
          else
            bash build-scripts/build-step-arm64ec.sh --build-sysvshm
          fi
      
      - name: Configure build for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --enable-16kb-pages --configure
          else
            bash build-scripts/build-step-arm64ec.sh --enable-16kb-pages --configure
          fi
      
      - name: Build Wine for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --enable-16kb-pages --build
          else
            bash build-scripts/build-step-arm64ec.sh --enable-16kb-pages --build
          fi
      
      - name: Install Wine for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            bash build-scripts/build-step-x86_64.sh --enable-16kb-pages --install
          else
            bash build-scripts/build-step-arm64ec.sh --enable-16kb-pages --install
          fi
      
      - name: Install QEMU user-mode (aarch64 only)
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get install -y qemu-user qemu-user-binfmt
          sudo update-binfmts --enable qemu-aarch64

      - name: Generate prefixPack.txz for ${{ matrix.arch }}
        run: |
          ARCH="${{ matrix.arch }}"
          if [ "$ARCH" == "x86_64" ]; then
            WINE_BINARY="$HOME/termuxfs/x86_64/data/data/com.termux/files/opt/wine/lib/wine/x86_64-unix/wine"
            WINE_SERVER="$HOME/termuxfs/x86_64/data/data/com.termux/files/opt/wine/bin/wineserver"
            WINE_DATA="$HOME/termuxfs/x86_64/data/data/com.termux/files/opt/wine/share/wine"
            QEMU_PREFIX=""
          else
            WINE_BINARY="$HOME/termuxfs/aarch64/data/data/com.termux/files/opt/wine/lib/wine/aarch64-unix/wine"
            WINE_SERVER="$HOME/termuxfs/aarch64/data/data/com.termux/files/opt/wine/bin/wineserver"
            WINE_DATA="$HOME/termuxfs/aarch64/data/data/com.termux/files/opt/wine/share/wine"
            QEMU_PREFIX="qemu-aarch64 -L $HOME/termuxfs/aarch64/data/data/com.termux/files/usr"
          fi
          
          # Run wineboot
          export WINEPREFIX=$HOME/wine-prefix/.wine
          export WINEARCH=win64
          export WINEDATADIR=$WINE_DATA
          mkdir -p $WINEPREFIX
          $QEMU_PREFIX $WINE_SERVER &
          sleep 2
          $QEMU_PREFIX $WINE_BINARY wineboot --init
          $QEMU_PREFIX $WINE_SERVER -w
          
          # Fix username
          CURRENT_USER=$(whoami)
          if [ -d "$WINEPREFIX/drive_c/users/$CURRENT_USER" ] && [ "$CURRENT_USER" != "xuser" ]; then
            mv "$WINEPREFIX/drive_c/users/$CURRENT_USER" "$WINEPREFIX/drive_c/users/xuser"
            sed -i "s|$CURRENT_USER|xuser|g" "$WINEPREFIX/user.reg"
            sed -i "s|$CURRENT_USER|xuser|g" "$WINEPREFIX/system.reg"
          fi
          rm -f "$WINEPREFIX/dosdevices/c:" "$WINEPREFIX/dosdevices/z:"
          
          # Download file list
          wget -q https://raw.githubusercontent.com/AndreVto/bionic-prefix-files/wine-11.x/prefix-files-${ARCH}.txt
          
          # Stage exact files from list
          STAGING=$HOME/prefix-staging
          mkdir -p $STAGING
          while IFS=' ' read -r type path; do
            # path is relative to staging root e.g. ".wine/drive_c/..."
            # source strips the leading .wine/ since WINEPREFIX already points there
            src="$WINEPREFIX/${path#.wine/}"
            dst="$STAGING/$path"
            if [ "$type" = "d" ]; then
              mkdir -p "$dst"
            elif [ "$type" = "f" ]; then
              mkdir -p "$(dirname "$dst")"
              [ -f "$src" ] && cp -a "$src" "$dst" || echo "WARNING: missing $path"
            fi
          done < prefix-files-${ARCH}.txt
          
          cd $STAGING
          tar -cJf $GITHUB_WORKSPACE/prefixPack.txz .wine/
      
      - name: Generate profile.json files
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            ARCH_NAME="x86_64"
          else
            ARCH_NAME="arm64ec"
          fi
          
          # Generate Wine profile.json
          cat > $GITHUB_WORKSPACE/profile.json << EOF
          {
            "type": "Wine",
            "versionName": "11.8-1-${ARCH_NAME}",
            "versionCode": 1,
            "description": "Wine 11.8-1 ${ARCH_NAME} - Windows compatibility layer",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF
          
          # Generate Wine profile.json for Ludashi
          cat > $GITHUB_WORKSPACE/profile-wine.json << EOF
          {
            "type": "Wine",
            "versionName": "11.8-1-${ARCH_NAME}",
            "versionCode": 0,
            "description": "Wine 11.8-1 ${ARCH_NAME} - Windows compatibility layer",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF
      
      - name: Package build artifacts
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            OUTPUT_DIR="$HOME/compiled-files-x86_64"
            ARCH_NAME="x86_64"
          else
            OUTPUT_DIR="$HOME/compiled-files-aarch64"
            ARCH_NAME="arm64ec"
          fi
          
          cd $OUTPUT_DIR
          
          # Create Wine WCP - txz format
          cp $GITHUB_WORKSPACE/prefixPack.txz .
          cp $GITHUB_WORKSPACE/profile.json .
          tar cJf wine-11.8-1-$ARCH_NAME.wcp bin lib share prefixPack.txz profile.json
          mv wine-11.8-1-$ARCH_NAME.wcp $GITHUB_WORKSPACE/
          
          # Create Wine WCP for CMOD & Ludashi - wcp.xz format
          cp $GITHUB_WORKSPACE/profile-wine.json profile.json
          tar cJf wine-11.8-1-$ARCH_NAME.wcp.xz bin lib share prefixPack.txz profile.json
          mv wine-11.8-1-$ARCH_NAME.wcp.xz $GITHUB_WORKSPACE/
      
      - name: Upload build artifacts
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            ARCH_NAME="x86_64"
          else
            ARCH_NAME="arm64ec"
          fi
          echo "ARCH_NAME=$ARCH_NAME" >> $GITHUB_ENV
      
      - name: Upload Wine WCP for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: wine-${{ env.ARCH_NAME }}-wcp
          path: wine-11.8-1-${{ env.ARCH_NAME }}.wcp
          retention-days: 30
      
      - name: Upload Wine WCP.XZ for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: wine-${{ env.ARCH_NAME }}-wcp-xz
          path: wine-11.8-1-${{ env.ARCH_NAME }}.wcp.xz
          retention-days: 30
  
  release:
    needs: build
    runs-on: ubuntu-24.04
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/wine-11.x')) || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.wcp" -exec cp {} release/ \;
          find artifacts -name "*.wcp.xz" -exec cp {} release/ \;
          ls -lah release/
      
      - name: Generate date-based tag
        id: generate_tag
        run: |
          DATE=$(date +%Y%m%d)
          
          # Get existing tags for today with SDK35 suffix
          EXISTING_TAGS=$(git tag -l "build-${DATE}-*-sdk35" | sort -V | tail -1)
          
          if [ -z "$EXISTING_TAGS" ]; then
            BUILD_NUMBER=1
          else
            # Extract build number from last tag and increment
            BUILD_NUMBER=$(echo "$EXISTING_TAGS" | sed "s/build-${DATE}-//" | sed "s/-sdk35//" | awk '{print $1 + 1}')
          fi
          
          TAG_NAME="build-${DATE}-${BUILD_NUMBER}-sdk35"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG_NAME}"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.generate_tag.outputs.tag_name }}
          name: Wine 11.8-1 (SDK 35, ${{ steps.generate_tag.outputs.tag_name }})
          files: release/*
          draft: false
          prerelease: false
          body: |
            # Caution: This version is provided for testing purposes only. It may lead to game instability or crashes. Use at your own risk.
            
            ## Wine Build based on [Wine](https://github.com/wine-mirror/wine/tree/wine-11.8)
            
            ### Wine Version: 11.8
            
            Built from commit: ${{ github.sha }}
            
            ### Architectures
            - x86_64 (Intel/AMD 64-bit)
            - arm64ec (ARM64EC)
            
            ### WCP Files
            **Wine Type:**
            - `wine-11.8-1-x86_64.wcp` - For GameNative
            - `wine-11.8-1-arm64ec.wcp` - For GameNative
            
            **Wine Type:**
            - `wine-11.8-1-x86_64.wcp.xz` - For Winlator for CMOD & Ludashi
            - `wine-11.8-1-arm64ec.wcp.xz` - For Winlator for CMOD & Ludashi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
